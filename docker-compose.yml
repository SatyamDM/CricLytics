services:

  spark-app:
    build: .
    container_name: spark_ipl_pipeline
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - postgres
    command: tail -f /dev/null

  postgres:
    image: postgres:15
    container_name: postgres_ipl
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ipl_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: